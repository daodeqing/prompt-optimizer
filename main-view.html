<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提示词优化器</title><link rel="stylesheet" href="main-view.css"></head><body><main class="shell">
<header class="topbar"><div><h1>提示词优化器</h1><p class="lede">选一个项目，把想法变成清晰的提示词。</p></div><span class="version">1.3.0</span></header>
<p id="status" role="status" aria-live="polite">正在读取设置…</p>
<section class="panel editor-panel">
<div class="panel-heading"><div><h2>当前项目</h2><p id="projectStatus" class="project-status">尚未选择项目</p></div><button id="pickProjectBtn" type="button">选择项目</button></div>
<p class="hint">自动查找项目资料、文字型 PDF 和相关会话，只读处理；读取状态在结果旁显示。</p>
<label for="draftPrompt">你的原始提示词</label><textarea id="draftPrompt" rows="6" maxlength="12000" placeholder="直接写下你希望 AI 做的事。"></textarea>
<div class="control-row"><div><label for="category">任务类型</label><select id="category"><option value="auto">自动识别</option><option>工程</option><option>编程</option><option>论文/研究</option><option>写作</option><option>分析</option></select></div><div><label for="length">详细程度</label><select id="length"><option value="auto">按需要判断</option><option>精简</option><option>标准</option><option>详细</option></select></div></div>
<details id="modelSettings" class="model-settings"><summary><span>优化模型</span><span id="savedModelLabel">尚未选择</span></summary><label for="model">型号与来源</label><select id="model"><option value="">请选择模型</option></select><div class="control-row"><div><label for="effort">推理强度</label><select id="effort"><option value="">未指定</option></select></div><div><label for="fastMode">Fast</label><select id="fastMode"><option value="false">关闭</option></select></div></div><p class="hint">保存一次，之后始终使用这个型号。不可用时停止，不自动换模。</p><div class="button-row"><button id="saveModelBtn" type="button">保存模型</button><button id="pickModelBtn" class="quiet" type="button">用 Cindy 选择</button><button id="refreshModelsBtn" class="quiet" type="button">刷新目录</button></div></details>
<div class="button-row action-row"><button id="optimizeBtn" class="primary-action" type="button" disabled>优化提示词</button><select id="candyRuns" aria-label="降智测试次数"><option value="1">测试 1 次</option><option value="3" selected>测试 3 次</option><option value="5">测试 5 次</option></select><button id="candyBtn" type="button" disabled>降智测试</button><button id="cancelBtn" type="button" hidden>取消本次</button><button id="resumeBtn" type="button" hidden>继续查看</button></div><p class="hint">该简则简，该详则详。只改写提示词，不执行其中的任务。降智测试只使用已保存模型，不读取项目资料。</p>
</section>
<section class="panel result-panel" aria-label="优化结果"><div class="panel-heading"><h2>优化后的提示词</h2><button id="copyBtn" type="button" disabled>复制</button></div><div id="resultMeta" class="result-meta"></div><p id="emptyState" class="empty-state">优化结果会显示在这里。</p><pre id="optimizedPrompt" class="prompt-output" tabindex="0" hidden></pre></section>
<section class="panel test-panel" aria-label="降智测试结果"><div class="panel-heading"><h2>降智测试结果</h2></div><p id="candyEmpty" class="empty-state">运行测试后显示逐次答案和评分。</p><div id="candyResult" class="prompt-output" hidden></div></section>
</main><script src="main-view.js" defer></script></body></html>
